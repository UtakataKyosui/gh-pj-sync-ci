name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: go.mod and go.sum are tidy
        run: go mod tidy -diff
      - name: go vet
        run: go vet ./...
      # Build the analyzers with the toolchain in go.mod, so they understand the Go
      # version the code targets and check the standard library that ships.
      - name: Use the toolchain from go.mod
        run: echo "GOTOOLCHAIN=$(go mod edit -json | jq -r .Toolchain)" >> "$GITHUB_ENV"
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          install-mode: goinstall
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Unit, golden, and end-to-end tests
        run: go test -race -coverpkg=./internal/... -coverprofile=coverage.out ./...
      - name: Coverage
        if: runner.os == 'Linux'
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ { sub("%", "", $3); print $3 }')
          echo "### Coverage: ${total}%" >> "$GITHUB_STEP_SUMMARY"
          awk -v t="$total" 'BEGIN { if (t < 85) { print "Coverage " t "% is below 85%"; exit 1 } }'
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Linux'
        with:
          name: coverage
          path: coverage.out

  smoke:
    # Install the build as a real gh extension and check the contract from the outside.
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go build -o gh-pj-synker .
      - run: gh extension install .
      - name: Help and version work and exit 0
        run: |
          gh pj-synker --help
          gh pj-synker add --help
          gh pj-synker --version
      - name: A usage error exits 2 before any request
        run: |
          set +e
          gh pj-synker add --lable triaged
          code=$?
          set -e
          test "$code" -eq 2
